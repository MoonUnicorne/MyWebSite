<!DOCTYPE html>
<html lang="fr-fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - My Django Application</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'app/content/site.css' %}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-sm bg-body-black navbar-light">

        <a href="{% url 'home' %}" class="navbar-brand">Florian Eckert</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsCommon" aria-controls="navbarsCommon" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="navbar-collapse collapse" id="navbarsCommon">
            <ul class="nav navbar-nav">
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'home' %} active {% endif %}" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'cv' %} active {% endif %}" href="{% url 'cv' %}">CV</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'about' %} active {% endif %}" href="{% url 'about' %}">About</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'contact' %} active {% endif %}" href="{% url 'contact' %}">Contact</a></li>
            </ul>
            <!--{% include 'app/loginpartial.html' %}-->
        </div>
    </nav>
    <div class="container body-content">
        {% block content %}{% endblock %}
        <hr />
        <footer>
            <div class="d-flex">
                <div class="p-2 mr-auto">
                    <span>&copy; {{ year }} - Florian Eckert</span>
                </div>
                <div class="p-2">
                    <a class="text-body-secondary" href="https://www.instagram.com/florian_eckert67"
                       aria-label="Instagram">
                        <i class="bi bi-instagram icons"></i>
                    </a>
                </div>
                <div class="p-2">
                    <a class="text-body-secondary" href="https://www.facebook.com/share/1BGPMMCVbw/"
                       aria-label="Facebook">
                        <i class="bi bi-facebook icons"></i>
                    </a>
                </div>
                <div class="p-2">
                    <a class="text-body-secondary" href="https://www.linkedin.com/in/florian-eckert-b129531a2"
                       aria-label="Linkedin">
                        <i class="bi bi-linkedin icons"></i>
                    </a>
                </div>
                <div class="p-2">
                    <a class="text-body-secondary" href="https://github.com/MoonUnicorne"
                       aria-label="GitHub">
                        <i class="bi bi-github icons"></i>
                    </a>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
