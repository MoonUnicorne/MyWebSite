{% extends 'templateCommon.html' %}


{% block headTitle %}
Articles
{% endblock %}

{% block contenu %}
<h1>Les article</h1>

<div class="row">
{% for article in articles %}
<div class="col-sm-6 col-md-4 col-lg-3">
    <div class="card card-body">
        <h5 class="card-title">{{ article.titre }}</h5>
        <h6 class="card-subtitle text-muted">{{ article.datePublication }}</h6>
        <p class="card-text">{{ article.contenu }}</p>
    </div>
</div>

{% endfor %}
</div>



{% endblock %}
